<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover">
<meta name="description" content="Ranking, sorteio, placar ao vivo e batalhas entre peladas.">
<link rel="manifest" href="manifest.webmanifest"><link rel="apple-touch-icon" href="apple-touch-icon.png"><link rel="icon" type="image/png" href="icon-192.png"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black"><meta name="apple-mobile-web-app-title" content="Pelada OFC">
<title>Pelada Organizada OFC</title>
<meta name="theme-color" content="#0B0B0A">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@700;800;900&family=Barlow:wght@400;500;600;700&family=Barlow+Condensed:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  color-scheme:dark;
  --bg:#0B0B0A;--s1:#161614;--s2:#1F1E1B;--s3:#2A2925;--line:#2F2E29;
  --tx:#F6F5EF;--mu:#A09E92;--mu2:#6F6D63;
  --y:#FFD400;--y2:#FFE45C;--yk:#0B0B0A;--ysoft:rgba(255,212,0,.12);
  --g:#22C55E;--gsoft:rgba(34,197,94,.14);--r:#F04438;--rsoft:rgba(240,68,56,.14);--b:#3B82F6;
  --silver:#D6D5CE;--bronze:#C98A4B;
  --disp:'Big Shoulders Display',Impact,'Arial Narrow',sans-serif;
  --body:'Barlow',system-ui,-apple-system,'Segoe UI',sans-serif;
  --num:'Barlow Condensed','Arial Narrow',system-ui,sans-serif;
}
*{box-sizing:border-box}
html,body{background:var(--bg);color:var(--tx);height:100%}
body{font-family:var(--body);font-size:15px;line-height:1.4;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;padding:0}
input,select,textarea{font:inherit;color:var(--tx);background:var(--s2);border:1px solid var(--line);border-radius:12px;padding:12px 14px;width:100%;outline:none}
input:focus,select:focus,textarea:focus{border-color:var(--y)}
textarea{min-height:140px;resize:vertical;line-height:1.45;font-size:14px}
:focus-visible{outline:2px solid var(--y);outline-offset:2px}
.app{max-width:520px;margin:0 auto;padding:0 16px calc(104px + env(safe-area-inset-bottom,0px))}

/* header */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:linear-gradient(var(--bg) 78%,rgba(11,11,10,0));margin:0 -16px;padding:12px 16px 14px;display:flex;align-items:center;gap:12px}
.brand{display:flex;align-items:center;gap:10px;flex:1;min-width:0}
.mark{width:40px;height:40px;border-radius:12px;background:var(--y);display:grid;place-items:center;flex:none;overflow:hidden}
.mark img{width:100%;height:100%;object-fit:cover}
.brand-t{min-width:0}
.eyebrow{font-family:var(--num);font-weight:700;font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--y)}
.brand-n{font-family:var(--disp);font-weight:800;font-size:22px;line-height:1;text-transform:uppercase;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mode{font-family:var(--num);font-weight:700;font-size:12px;letter-spacing:.1em;text-transform:uppercase;padding:7px 11px;border-radius:999px;border:1.5px solid var(--y);color:var(--y);flex:none}
.mode.on{background:var(--y);color:var(--yk)}

/* nav */
.nav{position:fixed;left:0;right:0;bottom:0;z-index:30;background:rgba(14,14,13,.94);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-top:1px solid var(--line);padding:8px 8px calc(8px + env(safe-area-inset-bottom,0px))}
.nav-in{max-width:520px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr);align-items:end}
.nb{display:flex;flex-direction:column;align-items:center;gap:3px;font-family:var(--num);font-weight:600;font-size:11.5px;letter-spacing:.04em;color:var(--mu);padding:4px 0}
.nb svg{width:23px;height:23px}
.nb.on{color:var(--y)}
.nb.mid .ball{width:54px;height:54px;border-radius:18px;background:var(--y);color:var(--yk);display:grid;place-items:center;margin-top:-26px;box-shadow:0 8px 24px rgba(255,212,0,.28),0 0 0 5px var(--bg)}
.nb.mid .ball svg{width:28px;height:28px}
.nb.mid.on{color:var(--y)}

/* type */
h1,h2,h3{margin:0;font-family:var(--disp);text-transform:uppercase;letter-spacing:.01em;text-wrap:balance}
h1{font-size:34px;font-weight:900;line-height:.95}
h2{font-size:22px;font-weight:800;line-height:1}
h3{font-size:17px;font-weight:800}
.lbl{font-family:var(--num);font-weight:700;font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--mu)}
.mu{color:var(--mu)}
.small{font-size:13px}
.num{font-family:var(--num);font-variant-numeric:tabular-nums}
.sec{display:flex;flex-direction:column;gap:12px;margin-top:22px}
.sec-h{display:flex;align-items:baseline;justify-content:space-between;gap:12px}
.stack{display:flex;flex-direction:column;gap:10px}
.row{display:flex;align-items:center;gap:10px}
.wrap{flex-wrap:wrap}
.grow{flex:1;min-width:0}
.card{background:var(--s1);border:1px solid var(--line);border-radius:18px;padding:16px}
.card.flat{background:transparent}
.hr{height:1px;background:var(--line);margin:4px 0}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:46px;padding:0 18px;border-radius:14px;background:var(--y);color:var(--yk);font-family:var(--num);font-weight:700;font-size:16px;letter-spacing:.06em;text-transform:uppercase}
.btn:active{transform:scale(.98)}
.btn.ghost{background:var(--s2);color:var(--tx);border:1px solid var(--line)}
.btn.line{background:transparent;color:var(--y);border:1.5px solid var(--y)}
.btn.danger{background:var(--rsoft);color:var(--r)}
.btn.sm{min-height:36px;padding:0 12px;font-size:13.5px;border-radius:11px}
.btn.block{width:100%}
.btn[disabled]{opacity:.4;pointer-events:none}
.link{color:var(--y);font-family:var(--num);font-weight:700;font-size:13px;letter-spacing:.08em;text-transform:uppercase}
.ico{width:36px;height:36px;border-radius:11px;display:grid;place-items:center;background:var(--s2);border:1px solid var(--line);flex:none}
.ico svg{width:18px;height:18px}

/* segmented */
.seg{display:flex;background:var(--s1);border:1px solid var(--line);border-radius:14px;padding:4px;gap:4px;overflow-x:auto;scrollbar-width:none}
.seg::-webkit-scrollbar{display:none}
.seg button{flex:1;white-space:nowrap;padding:9px 12px;border-radius:10px;font-family:var(--num);font-weight:700;font-size:14px;letter-spacing:.05em;text-transform:uppercase;color:var(--mu)}
.seg button.on{background:var(--y);color:var(--yk)}

/* chips & pills */
.chip{display:inline-flex;align-items:center;gap:6px;padding:5px 10px;border-radius:999px;background:var(--s2);border:1px solid var(--line);font-size:13px;font-weight:500}
.pill{display:inline-flex;align-items:center;gap:5px;padding:3px 9px;border-radius:999px;font-family:var(--num);font-weight:700;font-size:12px;letter-spacing:.06em;text-transform:uppercase}
.pill.y{background:var(--ysoft);color:var(--y)}
.pill.g{background:var(--gsoft);color:var(--g)}
.pill.r{background:var(--rsoft);color:var(--r)}
.pill.n{background:var(--s3);color:var(--mu)}
.nota{font-family:var(--num);font-weight:700;font-size:13px;color:var(--yk);background:var(--y);border-radius:8px;padding:2px 7px;font-variant-numeric:tabular-nums}
.sw{width:14px;height:14px;border-radius:5px;flex:none;border:1.5px solid rgba(255,255,255,.35)}

/* avatar */
.av{width:40px;height:40px;border-radius:50%;background:var(--s3);display:grid;place-items:center;font-family:var(--disp);font-weight:800;font-size:16px;color:var(--y);flex:none;overflow:hidden;text-transform:uppercase}
.av img{width:100%;height:100%;object-fit:cover}
.av.sm{width:30px;height:30px;font-size:12px}
.av.lg{width:64px;height:64px;font-size:24px}

/* banner */
.demo{display:flex;gap:10px;align-items:center;background:var(--ysoft);border:1px dashed rgba(255,212,0,.45);color:var(--y2);border-radius:14px;padding:10px 12px;font-size:13px;margin-top:4px}

/* hero pelada */
.hero{position:relative;overflow:hidden;border-radius:22px;background:var(--y);color:var(--yk);padding:18px}
.hero::after{content:"";position:absolute;right:-40px;top:-40px;width:180px;height:180px;border-radius:50%;border:26px solid rgba(0,0,0,.07)}
.hero::before{content:"";position:absolute;right:48px;top:-10px;bottom:-10px;width:2px;background:rgba(0,0,0,.08)}
.hero .lbl{color:rgba(11,11,10,.62)}
.hero h1{position:relative;z-index:1}
.hero-row{display:flex;gap:14px;align-items:center;position:relative;z-index:1}
.hero-logo{width:62px;height:62px;border-radius:18px;background:var(--yk);display:grid;place-items:center;overflow:hidden;flex:none}
.hero-logo img{width:100%;height:100%;object-fit:cover}
.hero-meta{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px;position:relative;z-index:1}
.hero-meta span{background:rgba(11,11,10,.1);border-radius:999px;padding:5px 10px;font-family:var(--num);font-weight:700;font-size:13px;letter-spacing:.04em}

/* podium */
.podium{display:grid;grid-template-columns:1fr 1.12fr 1fr;align-items:end;gap:8px;padding-top:8px}
.pd{display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center;min-width:0}
.pd .nm{font-weight:700;font-size:14px;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pd .pt{font-family:var(--num);font-weight:700;font-size:13px;color:var(--mu)}
.step{width:100%;border-radius:14px 14px 6px 6px;display:grid;place-items:center;font-family:var(--disp);font-weight:900;font-size:30px;color:var(--yk)}
.pd.p1 .step{height:92px;background:var(--y)}
.pd.p2 .step{height:68px;background:var(--silver)}
.pd.p3 .step{height:52px;background:var(--bronze)}
.pd.p1 .av{box-shadow:0 0 0 3px var(--y)}
.crown{color:var(--y);height:16px}

/* list rows */
.lr{display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid var(--line)}
.lr:last-child{border-bottom:0}
.rk{width:26px;text-align:center;font-family:var(--disp);font-weight:800;font-size:18px;color:var(--mu);flex:none}
.rk.t{color:var(--y)}
.bar{height:6px;background:var(--s3);border-radius:4px;overflow:hidden;margin-top:6px}
.bar i{display:block;height:100%;background:var(--y);border-radius:4px}
.big{font-family:var(--disp);font-weight:900;font-size:26px;line-height:1}

/* tables */
.tw{overflow-x:auto;margin:0 -16px;padding:0 16px}
table{border-collapse:collapse;width:100%;font-size:14px}
th{font-family:var(--num);font-weight:700;font-size:11.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--mu);text-align:center;padding:8px 6px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:9px 6px;border-bottom:1px solid var(--line);text-align:center;font-family:var(--num);font-weight:600;font-size:15px;font-variant-numeric:tabular-nums;white-space:nowrap}
th.l,td.l{text-align:left}
td.name{font-family:var(--body);font-weight:600;font-size:14px;max-width:130px;overflow:hidden;text-overflow:ellipsis}
td.pts{color:var(--y);font-weight:700}
tr.top3 td:first-child{color:var(--y)}
.sticky{position:sticky;left:0;background:var(--bg);z-index:1}
.plan th.grp{color:var(--y);border-left:1px solid var(--line)}
.plan td.gs,.plan th.gs{border-left:1px solid var(--line)}
.plan td.z{color:var(--mu2)}
tr.tap{cursor:pointer}

/* rodada cards */
.rc{display:flex;gap:12px;align-items:center;background:var(--s1);border:1px solid var(--line);border-radius:18px;padding:10px;width:100%;text-align:left}
.thumb{width:74px;height:74px;border-radius:13px;background:var(--s3);flex:none;overflow:hidden;display:grid;place-items:center;color:var(--mu2)}
.thumb img{width:100%;height:100%;object-fit:cover}
.date-big{font-family:var(--disp);font-weight:900;font-size:26px;line-height:.9}
.photo{border-radius:20px;overflow:hidden;background:var(--s2);aspect-ratio:4/3;max-width:100%;display:grid;place-items:center;position:relative;border:1px solid var(--line)}
.photo img{width:100%;height:100%;object-fit:cover}
.photo .tag{position:absolute;left:12px;bottom:12px;background:var(--y);color:var(--yk);font-family:var(--num);font-weight:700;letter-spacing:.08em;text-transform:uppercase;font-size:12px;padding:5px 10px;border-radius:999px}
.gal{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.gal .ph{border-radius:16px;overflow:hidden;background:var(--s2);aspect-ratio:1;position:relative;border:1px solid var(--line)}
.gal .ph img{width:100%;height:100%;object-fit:cover}
.gal .ph span{position:absolute;left:8px;bottom:8px;background:rgba(11,11,10,.8);font-family:var(--num);font-weight:700;font-size:12px;padding:3px 8px;border-radius:8px}
.quote{border-left:3px solid var(--y);padding:2px 0 2px 12px;font-size:14.5px}
.quote b{display:block;font-family:var(--num);font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--y);margin-bottom:2px}

/* sorteio */
.pick{display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:13px;background:var(--s1);border:1px solid var(--line);width:100%;text-align:left}
.pick.on{border-color:var(--y);background:var(--ysoft)}
.box{width:22px;height:22px;border-radius:7px;border:2px solid var(--mu2);display:grid;place-items:center;flex:none}
.pick.on .box{background:var(--y);border-color:var(--y);color:var(--yk)}
.picks{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.team{border-radius:18px;background:var(--s1);border:1px solid var(--line);overflow:hidden}
.team-h{display:flex;align-items:center;gap:10px;padding:12px 14px;border-bottom:1px solid var(--line)}
.team-h input{background:transparent;border:0;padding:0;font-family:var(--disp);font-weight:800;font-size:19px;text-transform:uppercase;min-width:0}
.team-p{display:flex;flex-wrap:wrap;gap:6px;padding:12px 14px}
.tp{display:inline-flex;align-items:center;gap:6px;padding:6px 10px;border-radius:999px;background:var(--s2);border:1px solid var(--line);font-size:14px;font-weight:600}
.tp.sel{border-color:var(--y);background:var(--y);color:var(--yk)}
.tp.sel .nota{background:var(--yk);color:var(--y)}
.swatches{display:flex;gap:6px}
.swb{width:22px;height:22px;border-radius:7px;border:2px solid transparent}
.swb.on{border-color:var(--tx)}

/* placar */
.board{background:#050505;border:1px solid var(--line);border-radius:24px;padding:16px;display:flex;flex-direction:column;gap:14px;position:relative;overflow:hidden}
.board::before{content:"";position:absolute;inset:0;background:repeating-linear-gradient(90deg,rgba(34,197,94,.035) 0 36px,transparent 36px 72px);pointer-events:none}
.clock{font-family:var(--num);font-weight:700;font-size:54px;line-height:1;text-align:center;letter-spacing:.02em;font-variant-numeric:tabular-nums;color:var(--y);position:relative}
.clock.over{color:var(--r)}
.sb{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:8px;position:relative}
.sbt{display:flex;flex-direction:column;align-items:center;gap:8px;min-width:0}
.sbt .tn{display:flex;align-items:center;gap:6px;font-family:var(--disp);font-weight:800;font-size:17px;text-transform:uppercase;max-width:100%}
.sbt .tn span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.score{font-family:var(--disp);font-weight:900;font-size:84px;line-height:.85;font-variant-numeric:tabular-nums}
.vs{font-family:var(--disp);font-weight:800;color:var(--mu2);font-size:20px}
.sbc{display:flex;gap:6px;width:100%}
.sbc .btn{flex:1;padding:0 8px}
.sbc .minus{flex:0 0 46px;background:var(--s2);color:var(--tx);border:1px solid var(--line)}
.ev{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--line);font-size:14px}
.ev:last-child{border-bottom:0}
.ev .x{margin-left:auto;color:var(--mu);width:30px;height:30px;border-radius:9px;display:grid;place-items:center}
.gm{display:grid;grid-template-columns:1fr auto 1fr;gap:8px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
.gm:last-child{border-bottom:0}
.gm .s{font-family:var(--disp);font-weight:900;font-size:22px;font-variant-numeric:tabular-nums;text-align:center;min-width:56px}
.gm .t{display:flex;align-items:center;gap:6px;font-weight:600;font-size:14px;min-width:0}
.gm .t span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.gm .t.r{justify-content:flex-end;text-align:right}
.gm .w{color:var(--y)}

.dur{position:relative;display:flex;flex-direction:column;gap:8px;align-items:center;padding-top:10px;border-top:1px solid var(--line)}
.dur-row{display:flex;align-items:center;gap:6px}
.dur-row button{width:44px;height:40px;border-radius:11px;background:var(--s2);border:1px solid var(--line);font-family:var(--num);font-weight:700;font-size:15px}
.dur-v{min-width:74px;text-align:center;display:flex;align-items:baseline;justify-content:center;gap:4px}
.dur-v b{font-family:var(--disp);font-weight:900;font-size:30px}
.dur-v span{color:var(--mu);font-size:13px}
.dur .opt{padding:6px 10px;font-size:13px}
/* batalha jogadores */
.bp{display:grid;grid-template-columns:1fr auto auto;gap:6px 10px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line)}
.bp:last-child{border-bottom:0}
.bp .nm{font-weight:600;font-size:14.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.mini{display:flex;flex-direction:column;align-items:center;gap:3px}
.mini .lbl{font-size:10px}
.mini .stp{gap:4px}
.mini .stp button{width:32px;height:32px;border-radius:9px;font-size:17px}
.mini .stp b{min-width:22px;font-size:18px}
.mini .stp b.on{color:var(--y)}
.share{display:flex;flex-wrap:wrap;gap:8px}
.share .btn{flex:1 1 auto}
.seg button.on .sw{border-color:rgba(0,0,0,.55)}
.tp[data-drag]{touch-action:none;user-select:none;-webkit-user-select:none;cursor:grab}
.ghost-drag{position:fixed;z-index:200;pointer-events:none;transform:translate(-50%,-60%) scale(1.12);background:var(--y);color:var(--yk);border-color:var(--y);box-shadow:0 12px 30px rgba(0,0,0,.55)}
.ghost-drag .nota{background:var(--yk);color:var(--y)}
html.arrastando .tp[data-drag]{opacity:.55}
.team.drop-on{border-color:var(--y)!important;background:var(--ysoft)}
.team.pool{border-style:dashed}
.team-h .x{width:28px;height:28px;display:grid;place-items:center;border-radius:8px}
.brand{text-align:left}
.netdot{font-family:var(--num);font-weight:700;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--r);background:var(--rsoft);padding:4px 8px;border-radius:999px}
.loading{min-height:70vh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px}
.loading .mark{width:64px;height:64px;border-radius:20px;animation:pulse 1.2s ease-in-out infinite}
@keyframes pulse{50%{transform:scale(.9);opacity:.7}}
html.vit,html.vit body{--bg:#000;--s1:#0E0E0D;--s2:#171715;--line:#232320;background:#000}
.vtop{margin-top:16px;display:flex;flex-direction:column;gap:10px}
.vtop h1{font-size:46px;line-height:.92}
.vtop h1 span{color:var(--y)}
.vtop p{margin:0;max-width:38ch}
.pgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:18px 10px;margin-top:4px}
.pcard{display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center;min-width:0;padding:4px 2px}
.pcard b{font-size:13.5px;line-height:1.15;max-width:100%;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.pcard .cid{font-size:11.5px;color:var(--mu);max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pcard .pill{font-size:10px;padding:2px 7px}
.plogo{width:88px;height:88px;max-width:100%;aspect-ratio:1;border-radius:50%;background:var(--y);display:grid;place-items:center;overflow:hidden;box-shadow:0 0 0 2px #000,0 0 0 3px var(--line);transition:transform .15s}
.pcard:active .plogo{transform:scale(.95)}
.plogo img{width:100%;height:100%;object-fit:cover}
.plogo.sm{width:40px;height:40px;box-shadow:none}
.minhas{display:flex;flex-direction:column;gap:8px}

/* ============ MOTOR: SÚMULA, PONTOS, CAMPEÃO ============ */
function pontos(x,pw){if(!x||!x.p)return 0;return x.g*pw.g+x.a*pw.a+x.e*pw.e+x.v*pw.v+x.f*pw.f}
function statsTimes(r){const m={};r.times.forEach(t=>m[t.id]={v:0,e:0,d:0,gp:0,gc:0,j:0});
 r.jogos.filter(g=>g.fim).forEach(g=>{const a=m[g.a],b=m[g.b];if(!a||!b)return;a.j++;b.j++;a.gp+=g.ga;a.gc+=g.gb;b.gp+=g.gb;b.gc+=g.ga;if(g.ga>g.gb){a.v++;b.d++}else if(g.gb>g.ga){b.v++;a.d++}else{a.e++;b.e++}});return m}
function campeaoCalc(r){const m=statsTimes(r);let best=null;
 r.times.forEach(t=>{const s=m[t.id];if(!best){best=t;return}const b=m[best.id];const sd=s.gp-s.gc,bd=b.gp-b.gc;if(s.v>b.v||(s.v===b.v&&(sd>bd||(sd===bd&&s.gp>b.gp))))best=t});
 if(!best||m[best.id].v===0)return null;return best}
function campeaoDe(r){if(r.fechada)return r.times.find(t=>t.id===r.campeaoId)||null;return campeaoCalc(r)}
function sumulaAuto(r){const s={};const g0=id=>s[id]||(s[id]={p:0,g:0,a:0,e:0,v:0,f:0});
 r.presentes.filter(id=>!(J(id)||{}).goleiro).forEach(id=>g0(id).p=1);
 r.jogos.forEach(g=>{g.ev.forEach(e=>{if(e.autor)g0(e.autor).g++;if(e.assist)g0(e.assist).a++});
  if(!g.fim)return;const res=g.ga>g.gb?'a':g.gb>g.ga?'b':'e';
  g.pa.forEach(id=>{const x=g0(id);if(res==='a')x.v++;else if(res==='e')x.e++});
  g.pb.forEach(id=>{const x=g0(id);if(res==='b')x.v++;else if(res==='e')x.e++})});
 const c=campeaoDe(r);if(c)c.jogadores.forEach(id=>{if(s[id]&&s[id].p)s[id].f=1});
 return s}
function sumula(r){const s=sumulaAuto(r);Object.entries(r.manual||{}).forEach(([id,x])=>{s[id]={...x}});
 Object.keys(s).forEach(id=>{if(!J(id))delete s[id]});return s}
function noPer(data,per){const[y,m]=data.split('-').map(Number);return per.tipo==='ano'?y===per.ano:(y===per.ano&&m===per.mes)}
function agregado(per,pid=S.atual){const p=P(pid);const rs=S.rodadas.filter(r=>r.peladaId===pid&&r.fechada&&noPer(r.data,per)).sort((a,b)=>a.data.localeCompare(b.data));
 const tot={};rs.forEach(r=>{const s=sumula(r);Object.entries(s).forEach(([id,x])=>{const t=tot[id]||(tot[id]={id,p:0,g:0,a:0,e:0,v:0,f:0,pts:0});['p','g','a','e','v','f'].forEach(k=>t[k]+=x[k]);t.pts+=pontos(x,p.pesos)})});
 Object.values(tot).forEach(t=>t.pts=Math.round(t.pts*100)/100);
 return {rows:Object.values(tot).filter(t=>J(t.id)&&t.p>0&&(p.avulsoRank||!J(t.id).avulso)),rodadas:rs}}
const ordMVP=(x,y)=>y.pts-x.pts||y.v-x.v||y.g-x.g||y.f-x.f||nomeJ(x.id).localeCompare(nomeJ(y.id));
function periodoPadrao(){const d=new Date();const per={tipo:'mes',ano:d.getFullYear(),mes:d.getMonth()+1};
 if(agregado(per).rodadas.length)return per;const r=rodadasDe().find(r=>r.fechada);if(r){const[y,m]=r.data.split('-').map(Number);return{tipo:'mes',ano:y,mes:m}}return per}
function perLabel(per){return per.tipo==='ano'?'Ano '+per.ano:MESES[per.mes-1]+' '+per.ano}

/* ============ SORTEIO BALANCEADO ============ */
function sortear(ids,nt,prev){
 const n=id=>(J(id)||{}).nota||3;
 const sig=T=>T.map(t=>[...t].sort().join(',')).sort().join('|');
 const prevSig=prev&&prev.length?sig(prev.map(t=>t.jogadores.filter(x=>ids.includes(x)))):null;
 const size=Array.from({length:nt},(_,i)=>Math.floor(ids.length/nt)+(i<ids.length%nt?1:0));
 const dif=T=>{const f=T.map(t=>t.reduce((s,id)=>s+n(id),0)/Math.max(1,t.length));return Math.max(...f)-Math.min(...f)};
 const cands=[];
 for(let tr=0;tr<500;tr++){
  const ord=ids.map(id=>({id,k:n(id)+(Math.random()-.5)*1.5})).sort((a,b)=>b.k-a.k);
  const T=Array.from({length:nt},()=>[]);const sum=Array(nt).fill(0);
  ord.forEach(p=>{let b=-1;for(let i=0;i<nt;i++){if(T[i].length>=size[i])continue;const m=sum[i]/Math.max(1,T[i].length);if(b<0||m<sum[b]/Math.max(1,T[b].length)||(m===sum[b]/Math.max(1,T[b].length)&&Math.random()<.5))b=i}T[b].push(p.id);sum[b]+=n(p.id)});
  let cur=dif(T);
  for(let it=0;it<80;it++){const i=Math.random()*nt|0,j=Math.random()*nt|0;if(i===j||!T[i].length||!T[j].length)continue;const a=Math.random()*T[i].length|0,b=Math.random()*T[j].length|0;[T[i][a],T[j][b]]=[T[j][b],T[i][a]];const o=dif(T);if(o<=cur)cur=o;else [T[i][a],T[j][b]]=[T[j][b],T[i][a]]}
  cands.push({T,d:cur,s:sig(T)})}
 cands.sort((a,b)=>a.d-b.d);const best=cands[0].d;
 const bons=[...new Map(cands.filter(c=>c.d<=best+0.2&&c.s!==prevSig).map(c=>[c.s,c])).values()];
 const pick=bons.length?bons[Math.random()*bons.length|0]:(cands.find(c=>c.s!==prevSig)||cands[0]);
 return pick.T.map((t,i)=>({id:uid(),nome:'Time '+(i+1),cor:CORES[i%CORES.length].c,jogadores:shuffle(t)}))}
const somaNota=t=>t.jogadores.reduce((s,id)=>s+((J(id)||{}).nota||0),0);

/* ============ COMENTÁRIOS ============ */
function gerarComentarios(r){const p=P(r.peladaId);const F=p.frases;const s=sumula(r);const out={};
 const pres=r.presentes.filter(id=>J(id));const lst=pres.map(id=>({id,pts:pontos(s[id],p.pesos)})).sort((a,b)=>b.pts-a.pts);
 const maxG=Math.max(0,...pres.map(id=>s[id]?s[id].g:0)),maxA=Math.max(0,...pres.map(id=>s[id]?s[id].a:0));const n=lst.length;
 const fr=(cat,id)=>{const l=(F[cat]&&F[cat].length?F[cat]:FRASES_PADRAO[cat]);return {cat,t:pick(l).split('{nome}').join(nomeJ(id))}};
 lst.forEach((o,i)=>{const x=s[o.id]||{};let c;
  if(maxG>0&&x.g===maxG)c='artilheiro';else if(maxA>0&&x.a===maxA)c='garcom';else if(x.f)c='campeao';else if(o.pts===0)c='zero';
  else{const q=i/n;c=q<.25?'bom':q>=.75?'ruim':'medio'}
  out[o.id]=fr(c,o.id)});
 const jaJogaram=new Set(S.rodadas.filter(x=>x.peladaId===r.peladaId).flatMap(x=>x.presentes));
 elenco(r.peladaId).filter(j=>!j.avulso&&!pres.includes(j.id)&&jaJogaram.has(j.id)).forEach(j=>out[j.id]=fr('faltou',j.id));
 return out}
const CAT_LBL={bom:'Mandou bem',medio:'Meio de tabela',ruim:'Dia ruim',artilheiro:'Artilheiro do dia',garcom:'Rei das assistências',campeao:'Campeão',zero:'Zerou',faltou:'Faltou'};

/* ============ ESTADO INICIAL (EXEMPLO) ============ */
function novaPelada(o){return {id:uid(),nome:o.nome,cidade:o.cidade||'',uf:o.uf||'SP',logo:o.logo||null,dia:o.dia??1,porTime:o.porTime||5,duracao:o.duracao||8,pesos:{...PESOS_PADRAO},frases:JSON.parse(JSON.stringify(FRASES_PADRAO))}}
function simularRodada(r){const nt=r.times.length;let fila=r.times.map(t=>t.id);let a=fila[0],b=fila[1];
 const forca=tid=>{const t=r.times.find(x=>x.id===tid);return somaNota(t)/Math.max(1,t.jogadores.length)};
 const n=7+Math.floor(Math.random()*3);
 for(let k=0;k<n;k++){const ta=r.times.find(t=>t.id===a),tb=r.times.find(t=>t.id===b);
  const g={id:uid(),a,b,ga:0,gb:0,pa:[...ta.jogadores],pb:[...tb.jogadores],ev:[],fim:true,el:0,t0:null};
  const gols=(f)=>{let x=0;const lam=.7+f*.35;for(let i=0;i<5;i++)if(Math.random()<lam/5)x++;return x};
  const add=(lado,t,qt)=>{for(let i=0;i<qt;i++){const pool=t.jogadores.flatMap(id=>Array(Math.round(((J(id)||{}).nota||2)*2)).fill(id));const autor=pick(pool);let assist=null;if(Math.random()<.6){const o=t.jogadores.filter(x=>x!==autor);if(o.length)assist=pick(o)}g.ev.push({id:uid(),lado,autor,assist});lado==='a'?g.ga++:g.gb++}};
  add('a',ta,gols(forca(a)));add('b',tb,gols(forca(b)));r.jogos.push(g);
  const outros=fila.filter(x=>x!==a&&x!==b);
  if(nt===2){}else if(g.ga>g.gb){fila=[a,...outros,b];b=outros[0]}else if(g.gb>g.ga){fila=[b,...outros,a];a=b;b=outros[0]}else{fila=[...outros,a,b];a=outros[0];b=outros[1]||fila[1]}}}
const NOMES_EX=[['Anderson','Andinho',3.5],['Marcos','',3],['Vitor','Vitão',4],['Paulo','',2.5],['Ricardo','Rick',3],['Henrique','Rique',4],['Mateus','',2],['César','',3.5],['Alex','',3],['Wagner','Waguinho',2.5]];

 h+=rows.length?podio(rows):empty('Sem rodadas fechadas nesse mês ainda.');h+='</section>';
 if(rows.length)h+=`<div class="kpis" style="margin-top:12px"><div class="kpi"><span class="lbl">Artilheiro do mês</span><span class="v">${art?art.g:0}</span><span class="n">${art?esc(nomeJ(art.id)):'—'}</span></div><div class="kpi"><span class="lbl">Garçom do mês</span><span class="v">${gar?gar.a:0}</span><span class="n">${gar?esc(nomeJ(gar.id)):'—'}</span></div></div>`;

function podio(rows){const t=[rows[1],rows[0],rows[2]];const cls=['p2','p1','p3'],pos=[2,1,3];
 return `<div class="podium">${t.map((r,i)=>r?`<div class="pd ${cls[i]}">${i===1?`<div class="crown">${I.crown}</div>`:''}${av(r.id,i===1?'lg':'')}<div class="nm">${esc(nomeJ(r.id))}</div><div class="pt">${fmt(r.pts)} pts</div><div class="step">${pos[i]}</div></div>`:'<div></div>').join('')}</div>`}

 const tabs=[['mvp','MVP'],['art','Artilharia'],['ass','Assist.'],['part','Gols+Assist.'],['plan','Planilha']];
 let h=`<div class="stack" style="margin-top:6px"><h1>Ranking</h1><div class="seg">${tabs.map(([k,l])=>`<button class="${U.rk===k?'on':''}" data-a="rk" data-v="${k}">${l}</button>`).join('')}</div>${perSelector()}</div>`;

 let h=`<div class="tw"><table class="plan"><thead><tr><th class="sticky l" rowspan="2">Jogador</th>${rs.map(r=>`<th class="grp" colspan="7">${dm(r.data)}</th>`).join('')}<th class="grp" colspan="7">Total</th></tr><tr>${[...rs,0].map(()=>cols.map((c,i)=>`<th class="${i===0?'gs':''}">${c}</th>`).join('')).join('')}</tr></thead><tbody>`;

  rs.forEach(r=>{const x=sumula(r)[t.id]||{p:0,g:0,a:0,e:0,v:0,f:0};const pt=pontos(x,p.pesos);[x.p,x.g,x.a,x.e,x.v,x.f].forEach((v,i)=>h+=`<td class="${i===0?'gs ':''}${v?'':'z'}">${v}</td>`);h+=`<td class="${pt?'pts':'z'}">${fmt(pt)}</td>`});
  [t.p,t.g,t.a,t.e,t.v,t.f].forEach((v,i)=>h+=`<td class="${i===0?'gs':''}">${v}</td>`);h+=`<td class="pts">${fmt(t.pts)}</td></tr>`});
 return h+'</tbody></table></div><div class="mu small">Arraste a tabela pro lado pra ver todos os dias.</div>'}

/* ============ BATALHAS (da pelada atual) ============ */
const batOk=b=>b.status==='marcada'&&b.okA&&b.okB;
function vBatalhas(){const ab=U.bat&&S.batalhas.find(x=>x.id===U.bat);if(ab)return vBatalha(ab);const me=S.atual;const adm=isAdm();
 const mine=S.batalhas.filter(b=>(b.a===me||b.b===me)&&P(b.a));
 const rec=mine.filter(b=>(b.status==='desafio'&&b.b===me)||(b.status==='candidatura'&&b.a===me));
 const esp=mine.filter(b=>(b.status==='desafio'&&b.a===me)||(b.status==='candidatura'&&b.b===me)||(b.status==='vaga'&&b.a===me));
 const marc=mine.filter(b=>b.status==='marcada'&&!(b.okA&&b.okB));const hist=mine.filter(batOk).sort((x,y)=>(y.data||'').localeCompare(x.data||''));
 const outro=b=>P(b.a===me?b.b:b.a);
 const quando=b=>`${b.data?dmy(b.data):'Data a combinar'}${b.hora?' · '+esc(b.hora):''}${b.local?' · '+esc(b.local):''}`;
 let h=backMais('Batalhas');
 if(adm)h+=`<div class="sec"><div class="grid2"><button class="btn" data-a="novoDesafio">Desafiar pelada</button><button class="btn line" data-a="novaVaga">Abrir vaga</button></div><div class="mu small">Desafio vai direto pra outra pelada aceitar. Vaga fica aberta pra qualquer pelada se candidatar.</div></div>`;
 if(rec.length)h+=`<div class="sec"><h2>Pra você responder</h2>${rec.map(b=>{const o=outro(b);return `<div class="card stack" style="border-color:var(--y)"><div class="row"><div class="mark" style="width:42px;height:42px;border-radius:12px">${logoHTML(o,42)}</div><div class="grow"><b>${esc(o?o.nome:'?')}</b><div class="mu small">${b.status==='desafio'?'desafiou vocês':'quer jogar na sua vaga'} · ${quando(b)}</div></div></div>${adm?`<div class="grid2"><button class="btn sm" data-a="batAceitar" data-id="${b.id}">Aceitar</button><button class="btn sm danger" data-a="batRecusar" data-id="${b.id}">Recusar</button></div>`:'<div class="mu small">Só o admin responde.</div>'}</div>`}).join('')}</div>`;
 if(marc.length)h+=`<div class="sec"><h2>Marcadas</h2>${marc.map(b=>{const A=P(b.a),B=P(b.b);return `<button class="card stack" style="text-align:left;width:100%" data-a="abrirBat" data-id="${b.id}"><div class="row"><span class="lbl grow">${quando(b)}</span><span class="pill y">${b.okA||b.okB?'Falta confirmar':'Marcada'}</span></div><div class="gm" style="border:0;padding:0"><div class="t"><span>${esc(A.nome)}</span></div><div class="s">${b.ga} × ${b.gb}</div><div class="t r"><span>${esc(B.nome)}</span></div></div></button>`}).join('')}</div>`;
 if(esp.length)h+=`<div class="sec"><h2>Aguardando resposta</h2>${esp.map(b=>{const o=b.status==='vaga'?null:outro(b);return `<div class="card row"><div class="grow"><b>${b.status==='vaga'?'Vaga aberta':esc(o?o.nome:'?')}</b><div class="mu small">${b.status==='vaga'?'Esperando alguém se candidatar':b.status==='desafio'?'Desafio enviado':'Você se candidatou'} · ${quando(b)}</div></div>${adm?`<button class="btn sm ghost" data-a="batCancelar" data-id="${b.id}">Cancelar</button>`:''}</div>`}).join('')}</div>`;
 h+=`<div class="sec"><h2>Resultados</h2>${hist.length?`<div class="card" style="padding:2px 14px">${hist.map(b=>{const A=P(b.a),B=P(b.b);return `<button class="gm" style="width:100%" data-a="abrirBat" data-id="${b.id}"><div class="t ${b.ga>b.gb?'w':''}"><span>${esc(A.nome)}</span></div><div class="s">${b.ga} × ${b.gb}</div><div class="t r ${b.gb>b.ga?'w':''}"><span>${esc(B.nome)}</span></div></button>`}).join('')}</div>`:empty('Nenhuma batalha confirmada ainda.')}</div>`;
 const rows=rankBatalhas().filter(r=>r.j>0);h+=`<div class="sec"><h2>Ranking de batalhas</h2>${rows.length?tabelaBat(rows):empty('Ainda sem ranking.')}</div>`;
 return h}
function vBatalha(b){const A=P(b.a),B=P(b.b);const me=S.atual;const lado=b.a===me?'a':'b';const ok=batOk(b);const ed=!ok&&b.status==='marcada'&&isAdm();const st=batSt(b);
 const meuGols=elenco(me).reduce((s,j)=>s+((st[j.id]||{}).g||0),0);const semAutor=(lado==='a'?b.ga:b.gb)-meuGols;
 let h=`<button class="back" data-a="fechaBat">${I.back} Batalhas</button><div class="stack" style="margin-top:8px"><div class="lbl">${b.data?dmy(b.data):''}${b.hora?' · '+esc(b.hora):''}${b.local?' · '+esc(b.local):''}</div><h1>Batalha</h1></div>`;
 const sbx=(P0,sc,l)=>`<div class="sbt"><div class="tn"><span>${esc(P0.nome)}</span></div><div class="score">${sc}</div>${ed?`<div class="sbc"><button class="btn minus" data-a="batGol" data-id="${b.id}" data-l="${l}" data-v="-1" aria-label="Tirar gol">−</button><button class="btn" data-a="batGol" data-id="${b.id}" data-l="${l}" data-v="1">+ Gol</button></div>`:''}</div>`;
 h+=`<div class="sec"><div class="board"><div class="sb">${sbx(A,b.ga,'a')}<div class="vs">×</div>${sbx(B,b.gb,'b')}</div>${ed?`<div class="mu small" style="text-align:center;position:relative">Gol lançado num jogador seu já soma no placar. O "+ Gol" de cima é pra gol contra / sem autor e pros gols do adversário.</div>`:''}</div>${ok?'<span class="pill g" style="align-self:flex-start">Confirmada</span>':''}</div>`;
 const el=elenco(me);const list=ed?el:el.filter(j=>st[j.id]&&(st[j.id].g||st[j.id].a));
 h+=`<div class="sec"><h2>Jogadores da ${esc(pel().nome)}</h2>`;
 if(!list.length)h+=empty(ed?'Cadastre os jogadores em Mais → Jogadores.':'Ninguém da sua pelada marcou gol nem deu assistência.');
 else h+=`<div class="card" style="padding:2px 14px">${list.map(j=>{const x=st[j.id]||{g:0,a:0};return `<div class="bp"><div class="nm">${esc(j.apelido||j.nome)}${avTag(j.id)}</div>${['g','a'].map(k=>`<div class="mini"><span class="lbl">${k==='g'?'Gols':'Assist.'}</span><div class="stp">${ed?`<button data-a="batJ" data-id="${b.id}" data-j="${j.id}" data-k="${k}" data-v="-1" aria-label="Menos">−</button>`:''}<b class="${x[k]?'on':''}">${x[k]||0}</b>${ed?`<button data-a="batJ" data-id="${b.id}" data-j="${j.id}" data-k="${k}" data-v="1" aria-label="Mais">+</button>`:''}</div></div>`).join('')}</div>`}).join('')}</div>`;
 if(semAutor>0)h+=`<div class="mu small">+ ${semAutor} gol${semAutor>1?'s':''} contra / sem autor</div>`;
 h+=`<div class="mu small">Os gols e assistências de cada jogador são lançados pelo admin da própria pelada.</div></div>`;
 if(b.status==='marcada'&&isAdm()){const meu=lado==='a'?b.okA:b.okB,dele=lado==='a'?b.okB:b.okA;
  h+=`<div class="sec"><div class="card stack"><div class="row"><div class="grow"><b>Confirmação do placar</b><div class="mu small">Vocês: ${meu?'✅ confirmado':'pendente'} · ${esc((lado==='a'?B:A).nome)}: ${dele?'✅ confirmado':'pendente'}</div></div></div>
  ${ok?`<button class="btn ghost block" data-a="reabrirBat" data-id="${b.id}">Corrigir resultado</button>`:`<button class="btn block ${meu?'ghost':''}" data-a="batConf" data-id="${b.id}">${meu?'Desfazer minha confirmação':'Confirmar placar'}</button>`}
  <div class="mu small">Entra no ranking quando as duas peladas confirmam. Mexeu no placar, as confirmações zeram.</div></div></div>`}
 return h}

function shAuth(){const m=U.sheet.modo||'entrar';return `<h2>${m==='criar'?'Criar conta':m==='esqueci'?'Recuperar senha':'Entrar'}</h2>
 ${m!=='esqueci'?`<div class="seg"><button class="${m==='entrar'?'on':''}" data-a="authModo" data-v="entrar">Entrar</button><button class="${m==='criar'?'on':''}" data-a="authModo" data-v="criar">Criar conta</button></div>`:''}
 <form id="fAuth" class="stack" data-f2="auth" method="post" action="#" autocomplete="on">${m==='criar'?`<label class="fl"><span>Seu nome (como a galera te chama)</span><input id="aNome" name="name" autocomplete="nickname" required></label>`:''}
 <label class="fl"><span>E-mail</span><input id="aEmail" name="username" type="email" autocomplete="username" inputmode="email" required></label>
 ${m!=='esqueci'?`<label class="fl"><span>Senha</span><input id="aSenha" name="password" type="password" autocomplete="${m==='criar'?'new-password':'current-password'}" minlength="6" required></label>`:''}
 <button class="btn block" type="submit">${m==='criar'?'Criar conta':m==='esqueci'?'Mandar link por e-mail':'Entrar'}</button></form>
 ${m==='entrar'?'<button class="link" data-a="authModo" data-v="esqueci">Esqueci minha senha</button>':''}

function shNovaSenha(){return `<h2>Nova senha</h2><form id="fNova" class="stack" data-f2="novaSenha"><label class="fl"><span>Nova senha (mínimo 6)</span><input id="nSenha" type="password" autocomplete="new-password" minlength="6" required></label><button class="btn block" type="submit">Salvar senha</button></form>`}
function shConvite(){return `<h2>Tenho um convite</h2><label class="fl"><span>Cole o link ou o código</span><input id="cvCod" autocomplete="off" placeholder="Ex.: a1b2c3d4e5"></label><button class="btn block" data-a="usarConvite">Entrar na pelada</button><button class="btn ghost block" data-a="fechaSheet">Cancelar</button>`}
function shConta(){return `<h2>${esc(nomeUser())}</h2><div class="mu">${esc(G.user?G.user.email:'')}</div><button class="btn ghost block" data-a="sair">Sair da conta</button><button class="btn ghost block" data-a="fechaSheet">Fechar</button>`}
function shVerPel(){const p=P(U.sheet.id);if(!p)return'';const r=rankBatalhas().find(x=>x.id===p.id)||{j:0};const adm=minhasAdmin().filter(id=>id!==p.id);
 const ult=S.batalhas.filter(b=>batOk(b)&&(b.a===p.id||b.b===p.id)).sort((x,y)=>(y.data||'').localeCompare(x.data||'')).slice(0,5);
 return `<div class="row" style="gap:14px"><div class="mark" style="width:72px;height:72px;border-radius:20px">${logoHTML(p,72)}</div><div class="grow"><h2>${esc(p.nome)}</h2><div class="mu">${esc(p.cidade)}/${p.uf} · toda ${DIAS[p.dia].toLowerCase()}</div></div></div>
 <div class="kpis" style="grid-template-columns:repeat(4,1fr)">${[['Jogos',r.j],['V',r.v||0],['E',r.e||0],['D',r.d||0]].map(([l,v])=>`<div class="kpi" style="align-items:center"><span class="lbl" style="font-size:10.5px">${l}</span><span class="v" style="font-size:24px">${v}</span></div>`).join('')}</div>
 ${ult.length?`<div class="card" style="padding:2px 14px">${ult.map(b=>{const A=P(b.a),B=P(b.b);return `<div class="gm"><div class="t ${b.ga>b.gb?'w':''}"><span>${esc(A.nome)}</span></div><div class="s">${b.ga} × ${b.gb}</div><div class="t r ${b.gb>b.ga?'w':''}"><span>${esc(B.nome)}</span></div></div>`}).join('')}</div>`:''}
 ${G.minhas[p.id]?`<button class="btn block" data-a="trocarPel" data-id="${p.id}">Abrir minha pelada</button>`:`${!G.user?`<button class="btn block" data-a="login" data-m="criar">Criar conta pra pedir entrada</button>`:G.pedidos[p.id]?`<div class="card row"><div class="grow"><b>Pedido enviado ✅</b><div class="mu small">Você pediu pra entrar como <b>${G.pedidos[p.id]==='admin'?'admin':'jogador'}</b>. Quando um admin aceitar, a pelada aparece em Minhas peladas.</div></div></div><button class="link" data-a="cancelaPedido" data-id="${p.id}">Cancelar pedido</button>`:`<button class="btn block" data-a="pedirEntrada" data-id="${p.id}" data-p="jogador">Pedir pra entrar como jogador</button><button class="btn ghost block" data-a="pedirEntrada" data-id="${p.id}" data-p="admin">Pedir pra entrar como admin</button><div class="mu small">Admin organiza a pelada: sorteio, placar, gols e assistências.</div>`}${adm.length?`<button class="btn line block" data-a="novoDesafio" data-alvo="${p.id}">Desafiar essa pelada</button>`:''}<div class="mu small">Ranking, jogadores e rodadas ficam visíveis só pra quem é da pelada.</div>`}
 <button class="btn ghost block" data-a="fechaSheet">Fechar</button>`}
function shDesafio(){const me=U.sheet.de||S.atual||minhasAdmin()[0];const alvo=U.sheet.alvo;const vaga=U.sheet.vaga;const adm=minhasAdmin();
 const outras=S.peladas.filter(p=>p.id!==me).sort((a,b)=>(a.uf+a.cidade+a.nome).localeCompare(b.uf+b.cidade+b.nome));
 return `<h2>${vaga?'Abrir vaga de batalha':'Desafiar pelada'}</h2>
 ${adm.length>1?`<label class="fl"><span>Sua pelada</span><select id="dDe">${adm.map(id=>`<option value="${id}" ${id===me?'selected':''}>${esc(P(id).nome)}</option>`).join('')}</select></label>`:''}
 ${vaga?'':`<label class="fl"><span>Adversário</span><select id="dAlvo">${outras.map(p=>`<option value="${p.id}" ${alvo===p.id?'selected':''}>${esc(p.nome)} · ${esc(p.cidade)}/${p.uf}</option>`).join('')}</select></label>`}
 <div class="grid2"><label class="fl"><span>Data</span><input id="dData" type="date" value="${hojeISO()}"></label><label class="fl"><span>Horário</span><input id="dHora" type="time" value="20:00"></label></div>
 <label class="fl"><span>Local</span><input id="dLocal" placeholder="Campo / quadra" autocomplete="off"></label>
 <button class="btn block" data-a="salvaDesafio" data-vaga="${vaga?1:''}">${vaga?'Abrir vaga':'Mandar desafio'}</button><button class="btn ghost block" data-a="fechaSheet">Cancelar</button>`}

/* ============ SHEETS ============ */
function openSheet(k,d={}){U.sheet={k,...d};renderSheet()}
function closeSheet(){U.sheet=null;U.gol=null;U.tmp={};renderSheet()}
function renderSheet(){const el=$('#sheet');if(!U.sheet){el.innerHTML='';return}const f={auth:shAuth,novaSenha:shNovaSenha,convite:shConvite,conta:shConta,verPel:shVerPel,desafio:shDesafio,txt:()=>`<h2>Copie o texto</h2><textarea id="rkTxt" style="min-height:260px" readonly>${esc(U.sheet.t)}</textarea><div class="mu small">Segure no texto → Selecionar tudo → Copiar.</div><button class="btn ghost block" data-a="fechaSheet">Fechar</button>`,gol:shGol,perfil:shPerfil,jog:shJog,sum:shSum,conf:shConf,pel:shPel}[U.sheet.k];
 el.innerHTML=`<div class="scrim" data-a="scrim"><div class="sheet" role="dialog" aria-modal="true"><div class="grab"></div>${f()}</div></div>`}
function shGol(){const r=aberta();const g=jogoAtual(r);const G=U.gol;const tid=G.lado==='a'?g.a:g.b;const t=r.times.find(x=>x.id===tid);const pl=G.lado==='a'?g.pa:g.pb;
 return `<div class="row"><span class="sw" style="width:22px;height:22px;background:${t.cor}"></span><h2 class="grow">Gol do ${esc(t.nome)}</h2></div>
 <div class="lbl">Quem fez?</div><div class="opts">${pl.map(id=>`<button class="opt ${G.autor===id?'on':''}" data-a="golAutor" data-id="${id}">${esc(nomeJ(id))}</button>`).join('')}<button class="opt ${G.autor==='x'?'on':''}" data-a="golAutor" data-id="x">Contra / sem autor</button></div>
 <div class="lbl">Assistência (opcional)</div><div class="opts"><button class="opt ${!G.assist?'on':''}" data-a="golAssist" data-id="">Sem assistência</button>${pl.filter(id=>id!==G.autor).map(id=>`<button class="opt ${G.assist===id?'on':''}" data-a="golAssist" data-id="${id}">${esc(nomeJ(id))}</button>`).join('')}</div>
 <button class="btn block" data-a="golOk" ${G.autor?'':'disabled'}>Confirmar gol</button><button class="btn ghost block" data-a="fechaSheet">Cancelar</button>`}
function shPerfil(){const j=J(U.sheet.id);if(!j)return'';const ano=new Date().getFullYear();const ag=agregado({tipo:'ano',ano}).rows.find(r=>r.id===j.id)||{p:0,g:0,a:0,v:0,e:0,f:0,pts:0};
 const rk=agregado({tipo:'ano',ano}).rows.sort(ordMVP).findIndex(r=>r.id===j.id);
 return `<div class="row" style="gap:14px">${av(j.id,'lg')}<div class="grow"><h2>${esc(j.apelido||j.nome)}</h2><div class="mu">${j.apelido?esc(j.nome):''}</div></div>${isAdm()&&!j.goleiro?`<span class="nota" style="font-size:16px">${fmtNota(j.nota)}</span>`:''}</div>
 <div class="lbl">Temporada ${ano}${rk>=0?` · ${rk+1}º no MVP`:''}</div>
 <div class="kpis" style="grid-template-columns:repeat(3,1fr)">${[['Pontos',fmt(ag.pts)],['Jogos',ag.p],['Gols',ag.g],['Assist.',ag.a],['Vitórias',ag.v],['Fotos',ag.f]].map(([l,v])=>`<div class="kpi"><span class="lbl" style="font-size:10.5px">${l}</span><span class="v" style="font-size:24px">${v}</span></div>`).join('')}</div>
 ${isAdm()?`<button class="btn block" data-a="editJog" data-id="${j.id}">Editar jogador</button>`:''}<button class="btn ghost block" data-a="fechaSheet">Fechar</button>`}
function shJog(){const j=U.sheet.id?J(U.sheet.id):null;const foto=U.tmp.foto!==undefined?U.tmp.foto:(j&&j.foto);
 const eAv=U.tmp.avulso??(j?!!j.avulso:!!U.sheet.avulso);const eGk=U.tmp.goleiro??(j?!!j.goleiro:!!U.sheet.goleiro);const tipo=eGk?2:eAv?1:0;return `<h2>${j?'Editar jogador':(eGk?'Novo goleiro':eAv?'Novo avulso':'Novo jogador')}</h2>
 <label class="upl"><div class="av lg">${foto?`<img src="${foto}" alt="">`:I.cam.replace('28','22').replace('28','22')}</div><div class="grow"><b>Foto</b><div class="mu small">Opcional</div></div><input type="file" accept="image/*" data-up="fotoJog"></label>
 <label class="fl"><span>Nome</span><input id="jNome" value="${esc(j?j.nome:'')}" placeholder="Ex.: Rodrigo Silva" autocomplete="off"></label>
 <label class="fl"><span>Apelido</span><input id="jApel" value="${esc(j?j.apelido:'')}" placeholder="Ex.: Digão" autocomplete="off"></label>
 <div class="fl"><span>Tipo</span><div class="opts">${[[0,'Elenco'],[1,'Avulso'],[2,'🧤 Goleiro']].map(([v,l])=>`<button class="opt ${tipo===v?'on':''}" data-a="jTipo" data-v="${v}">${l}</button>`).join('')}</div></div>
 <div class="fl" ${eGk?'style="display:none"':''}><span>Nota (só o admin vê)</span><div class="opts">${NOTAS.map(n=>`<button class="opt ${(U.tmp.nota??(j?j.nota:3))===n?'on':''}" data-a="jNota" data-v="${n}">${fmtNota(n)}</button>`).join('')}</div></div>
 <button class="btn block" data-a="salvaJog">Salvar</button>${j?`<button class="btn danger block" data-a="delJog" data-id="${j.id}">Remover do elenco</button>`:''}<button class="btn ghost block" data-a="fechaSheet">Cancelar</button>`}
function shSum(){const r=aberta();const id=U.sheet.id;const x=U.tmp.x||(U.tmp.x={...(sumula(r)[id]||{p:1,g:0,a:0,e:0,v:0,f:0})});
 return `<h2>${esc(nomeJ(id))}</h2><div class="mu small">Correção manual. Sobrescreve o que veio do placar.</div><div>${[['p','Presença',1],['g','Gols'],['a','Assistências'],['e','Empates'],['v','Vitórias'],['f','Foto (campeão)',1]].map(([k,l,mx])=>`<div class="stp-row"><b>${l}</b><div class="stp"><button data-a="sumStep" data-k="${k}" data-v="-1">−</button><b>${x[k]}</b><button data-a="sumStep" data-k="${k}" data-v="1" data-mx="${mx||''}">+</button></div></div>`).join('')}</div>
 <button class="btn block" data-a="sumOk">Salvar correção</button>${r.manual&&r.manual[id]?`<button class="btn ghost block" data-a="sumAuto">Voltar pro automático</button>`:''}<button class="btn ghost block" data-a="fechaSheet">Cancelar</button>`}
function shConf(){const c=U.sheet;return `<h2>${esc(c.titulo)}</h2><div class="mu">${esc(c.texto)}</div><button class="btn block ${c.perigo?'danger':''}" data-a="confOk">${esc(c.ok)}</button><button class="btn ghost block" data-a="fechaSheet">Cancelar</button>`}
function shPel(){const logo=U.tmp.logo;return `<h2>Nova pelada</h2>
 <label class="upl"><div class="mark" style="width:56px;height:56px;border-radius:14px">${logo?`<img src="${logo}" alt="">`:logoHTML({nome:'P'},56)}</div><div class="grow"><b>Logo</b><div class="mu small">Opcional</div></div><input type="file" accept="image/*" data-up="logoNova"></label>
 <label class="fl"><span>Nome</span><input id="npNome" placeholder="Ex.: Pelada do Parque" autocomplete="off"></label>
 <div class="grid2"><label class="fl"><span>Cidade</span><input id="npCid" autocomplete="off"></label><label class="fl"><span>Estado</span><select id="npUf">${UFS.map(u=>`<option ${u==='SP'?'selected':''}>${u}</option>`).join('')}</select></label></div>
 <label class="fl"><span>Dia do jogo</span><select id="npDia">${DIAS.map((d,i)=>`<option value="${i}" ${i===1?'selected':''}>${d}</option>`).join('')}</select></label>
 <div class="grid2"><label class="fl"><span>Jogadores por time</span><input id="npPT" type="number" value="5" min="2" max="11"></label><label class="fl"><span>Minutos por jogo</span><input id="npDur" type="number" value="8" min="1" max="90"></label></div>
 <button class="btn block" data-a="salvaPel">Cadastrar e abrir</button><button class="btn ghost block" data-a="fechaSheet">Cancelar</button>`}
function shBatOld(){const opts=sel=>S.peladas.map(p=>`<option value="${p.id}" ${sel===p.id?'selected':''}>${esc(p.nome)}</option>`).join('');const outro=S.peladas.find(p=>p.id!==S.atual);
 return `<h2>Nova batalha</h2><div class="grid2"><label class="fl"><span>Pelada A</span><select id="nbA">${opts(S.atual)}</select></label><label class="fl"><span>Pelada B</span><select id="nbB">${opts(outro&&outro.id)}</select></label></div>
 <div class="grid2"><label class="fl"><span>Data</span><input id="nbData" type="date" value="${hojeISO()}"></label><label class="fl"><span>Local</span><input id="nbLocal" placeholder="Campo / quadra" autocomplete="off"></label></div>
 <button class="btn block" data-a="salvaBat">Criar batalha</button><button class="btn ghost block" data-a="fechaSheet">Cancelar</button>`}

/* ============ IMAGEM ============ */
function lerImagem(file,max,cb){const fr=new FileReader();fr.onload=()=>{const img=new Image();img.onload=()=>{const k=Math.min(1,max/Math.max(img.width,img.height));const c=document.createElement('canvas');c.width=Math.round(img.width*k);c.height=Math.round(img.height*k);c.getContext('2d').drawImage(img,0,0,c.width,c.height);cb(c.toDataURL('image/jpeg',.78))};img.onerror=()=>toast('Não consegui abrir essa imagem.');img.src=fr.result};fr.readAsDataURL(file)}

/* ============ AÇÕES ============ */
const A={
 tab(d){U.tab=d.t;if(d.t!=='rodadas')U.rodada=null;if(d.t==='mais')U.mais=null;try{localStorage.setItem(K+'_tab',d.t)}catch(e){}SCRL.scrollTo(0,0);render()},
 rk(d){U.rk=d.v;render()},
 perTipo(d){U.per.tipo=d.v;render()},
 perfil(d){openSheet('perfil',{id:d.id})},
 irMais(d){U.mais=d.v||null;U.bat=null;U.tab='mais';SCRL.scrollTo(0,0);render()},
 jogoTab(d){U.jogo=d.v;U.sel=null;SCRL.scrollTo(0,0);render()},
 novaRodada(){const i=$('#novaData');const data=(i&&i.value)||hojeISO();if(aberta()){U.tab='jogo';return render()}
  if(!elenco().length){U.tab='mais';U.mais='jogadores';toast('Cadastre os jogadores primeiro.');return render()}
  S.rodadas.push({id:uid(),peladaId:S.atual,data,presentes:[],times:[],jogos:[],manual:{},fechada:false,foto:null,coment:{},campeaoId:null});U.tab='jogo';U.jogo='sorteio';U.nt=null;save();render()},
 pres(d){const r=aberta();const i=r.presentes.indexOf(d.id);if(i<0)r.presentes.push(d.id);else{r.presentes.splice(i,1);r.times.forEach(t=>t.jogadores=t.jogadores.filter(x=>x!==d.id))}U.nt=null;save();render()},
 presTodos(){const r=aberta();r.presentes=[...new Set(r.presentes.concat(elenco().filter(j=>!j.avulso&&!j.goleiro).map(j=>j.id)))];U.nt=null;save();render()},
 presNenhum(){const r=aberta();r.presentes=[];U.nt=null;save();render()},
 nt(d){U.nt=Math.max(2,Math.min(8,(U.nt||2)+Number(d.v)));render()},
 sortear(){const r=aberta();const lin=r.presentes.filter(id=>!ehGol(id));const nt=Math.min(U.nt||2,lin.length);r.times=sortear(lin,nt,r.times);U.sel=null;save();render();toast('Times sorteados e equilibrados.')},
 selJ(d,e){e.stopPropagation();if(U.sel&&U.sel!==d.id){const r=aberta();if(r&&onde(r,U.sel)!==onde(r,d.id))return trocar(U.sel,d.id)}U.sel=U.sel===d.id?null:d.id;render()},
 mover(d){if(!U.sel)return;moverPara(U.sel,d.t)},
 montar(){const r=aberta();if(r.times.some(t=>t.jogadores.length))return openSheet('conf',{titulo:'Montar do zero?',texto:'Os times atuais são desfeitos e todo mundo volta pro "Sem time".',ok:'Montar do zero',acao:'montar'});montarTimes()},
 addTime(){const r=aberta();const i=r.times.length;if(i>=8)return toast('Máximo de 8 times.');r.times.push({id:uid(),nome:'Time '+(i+1),cor:CORES[i%CORES.length].c,jogadores:[]});save();render()},
 delTime(d,e){e.stopPropagation();const r=aberta();r.times=r.times.filter(t=>t.id!==d.id||t.jogadores.length);save();render()},
 tcor(d,e){e.stopPropagation();const t=aberta().times.find(t=>t.id===d.id);t.cor=d.c;save();render()},
 comecarJogo(){const r=aberta();const[a,b]=U.novo;if(a===b)return toast('Escolha dois times diferentes.');const ta=r.times.find(t=>t.id===a),tb=r.times.find(t=>t.id===b);
  r.jogos.push({id:uid(),a,b,ga:0,gb:0,pa:[...ta.jogadores],pb:[...tb.jogadores],ev:[],fim:false,el:0,t0:null});U.novo=null;save();render()},
 clk(){const g=jogoAtual(aberta());if(g.t0){g.el=tempo(g);g.t0=null}else g.t0=Date.now();save();render()},
 clkZero(){const g=jogoAtual(aberta());g.el=0;g.t0=null;save();render()},
 golMais(d){U.pl=d.l;U.gol={lado:d.l,autor:null,assist:null};openSheet('gol')},
 golAutor(d){U.gol.autor=d.id;if(U.gol.assist===d.id)U.gol.assist=null;renderSheet()},
 golAssist(d){U.gol.assist=d.id||null;renderSheet()},
 golOk(){const g=jogoAtual(aberta());const G=U.gol;g.ev.push({id:uid(),lado:G.lado,autor:G.autor==='x'?null:G.autor,assist:G.assist});G.lado==='a'?g.ga++:g.gb++;save();const n=G.autor&&G.autor!=='x'?nomeJ(G.autor):'';closeSheet();render();toast(n?'GOOOL do '+n+'!':'Gol registrado.')},
 golMenos(d){const g=jogoAtual(aberta());const i=g.ev.map(e=>e.lado).lastIndexOf(d.l);if(i<0)return toast('Esse time não tem gol pra tirar.');g.ev.splice(i,1);d.l==='a'?g.ga--:g.gb--;save();render();toast('Último gol removido.')},
 delEv(d){const g=jogoAtual(aberta());const i=g.ev.findIndex(e=>e.id===d.id);if(i<0)return;const e=g.ev[i];g.ev.splice(i,1);e.lado==='a'?g.ga--:g.gb--;save();render()},
 encerrar(){const r=aberta();const g=jogoAtual(r);g.el=tempo(g);g.t0=null;g.fim=true;save();const T=id=>r.times.find(t=>t.id===id).nome;toast(g.ga===g.gb?'Empate!':'Vitória do '+(g.ga>g.gb?T(g.a):T(g.b))+'!');render()},
 cancelJogo(){openSheet('conf',{titulo:'Cancelar este jogo?',texto:'O placar e os lances deste jogo somem da súmula.',ok:'Cancelar jogo',perigo:1,acao:'cancelJogo'})},
 editSum(d){U.tmp={};openSheet('sum',{id:d.id})},
 sumStep(d){const x=U.tmp.x;const k=d.k;let v=x[k]+Number(d.v);if(v<0)v=0;if(d.mx&&v>Number(d.mx))v=Number(d.mx);x[k]=v;renderSheet()},
 sumOk(){const r=aberta();r.manual=r.manual||{};r.manual[U.sheet.id]={...U.tmp.x};if(U.tmp.x.p&&!r.presentes.includes(U.sheet.id))r.presentes.push(U.sheet.id);save();closeSheet();render();toast('Súmula corrigida.')},
 sumAuto(){const r=aberta();delete r.manual[U.sheet.id];save();closeSheet();render()},
 fecharDia(){openSheet('conf',{titulo:'Fechar o dia?',texto:'Calcula o campeão, os pontos, sorteia as frases da resenha e joga tudo no ranking. Dá pra reabrir depois se precisar.',ok:'Fechar o dia',acao:'fecharDia'})},
 apagarRodada(d){openSheet('conf',{titulo:'Apagar esta rodada?',texto:'Todos os jogos e a súmula desse dia serão apagados.',ok:'Apagar rodada',perigo:1,acao:'apagarRodada',id:d.id})},
 rodView(d){U.rodView=d.v;render()},
 abrirRodada(d){U.tab='rodadas';U.rodada=d.id;SCRL.scrollTo(0,0);render()},
 fecharRodada(){U.rodada=null;render()},
 reabrir(d){if(aberta())return toast('Já tem uma rodada aberta. Feche ela antes.');const r=R(d.id);r.fechada=false;U.tab='jogo';U.jogo='sumula';U.rodada=null;save();render();toast('Rodada reaberta. Corrija e feche de novo.')},
 refazComent(){const r=R(U.rodada);r.coment=gerarComentarios(r);save();render()},
 novoJog(){U.tmp={};openSheet('jog',{id:null})},
 editJog(d){U.tmp={};openSheet('jog',{id:d.id})},
 avRank(){const p=pel();p.avulsoRank=!p.avulsoRank;save();render()},
 jTipo(d){U.tmp.avulso=d.v==='1';U.tmp.goleiro=d.v==='2';renderSheet()},
 novoGoleiro(){U.tmp={};openSheet('jog',{id:null,goleiro:true,sorteio:!!aberta()&&U.tab==='jogo'})},
 novoAvulsoJ(){U.tmp={};openSheet('jog',{id:null,avulso:true})},
 novoAvulso(){U.tmp={};openSheet('jog',{id:null,avulso:true,sorteio:true})},
 jNota(d){U.tmp.nota=Number(d.v);renderSheet()},
 salvaJog(){const nome=$('#jNome').value.trim(),apelido=$('#jApel').value.trim();if(!nome)return toast('Coloca o nome do jogador.');
  const id=U.sheet.id;const gk=U.tmp.goleiro??(id?!!J(id).goleiro:!!U.sheet.goleiro);const avu=gk?false:(U.tmp.avulso??(id?!!J(id).avulso:!!U.sheet.avulso));
  if(id){const j=J(id);Object.assign(j,{nome,apelido,avulso:avu,goleiro:gk});if(U.tmp.nota!=null)j.nota=U.tmp.nota;if(U.tmp.foto!==undefined)j.foto=U.tmp.foto}
  else{const nj={id:uid(),peladaId:S.atual,nome,apelido,nota:U.tmp.nota??3,foto:U.tmp.foto||null,avulso:avu,goleiro:gk};S.jogadores.push(nj);
   if(U.sheet.sorteio){const r=aberta();if(r&&!r.presentes.includes(nj.id)){r.presentes.push(nj.id);U.nt=null}}}
  const sorteio=U.sheet.sorteio;save();closeSheet();render();toast(id?'Jogador atualizado.':(avu?(sorteio?'Avulso cadastrado e marcado como presente.':'Avulso cadastrado.'):'Jogador cadastrado.'))},
 delJog(d){openSheet('conf',{titulo:'Remover jogador?',texto:'Ele sai do elenco e dos rankings.',ok:'Remover',perigo:1,acao:'delJog',id:d.id})},
 abrirBat(d){U.bat=d.id;U.batLado='a';SCRL.scrollTo(0,0);render()},
 fechaBat(){U.bat=null;render()},
 batLado(d){U.batLado=d.v;render()},
 reabrirBat(d){const b=S.batalhas.find(x=>x.id===d.id);if(!isAdm())return;b.okA=b.okB=false;save();render();toast('Batalha reaberta. As duas peladas confirmam de novo.')},
 async tmShare(){const r=aberta();if(!r||!r.times.some(t=>t.jogadores.length))return toast('Monte os times primeiro.');toast('Gerando imagem…');const b=await tmBlob();const f=new File([b],tmNomeArq(),{type:'image/png'});
  try{if(navigator.canShare&&navigator.canShare({files:[f]})){await navigator.share({files:[f],text:tmTexto()});return}}catch(e){if(e&&e.name==='AbortError')return}
  baixarBlob(b,tmNomeArq());toast('Imagem baixada. É só mandar no grupo!')},
 async tmBaixar(){const b=await tmBlob();baixarBlob(b,tmNomeArq());toast('Imagem dos times baixada.')},
 async tmCopiar(){const t=tmTexto();try{await navigator.clipboard.writeText(t);toast('Texto copiado! Cola no grupo do WhatsApp.')}catch(e){openSheet('txt',{t})}},
 async rkShare(){toast('Gerando imagem…');const b=await rkBlob();const f=new File([b],rkNomeArq(),{type:'image/png'});
  try{if(navigator.canShare&&navigator.canShare({files:[f]})){await navigator.share({files:[f],text:rkTexto()});return}}catch(e){if(e&&e.name==='AbortError')return}
  baixarBlob(b,rkNomeArq());toast('Imagem baixada. É só mandar no grupo!')},
 async rkBaixar(){const b=await rkBlob();baixarBlob(b,rkNomeArq());toast('Imagem do ranking baixada.')},
 async rkCopiar(){const t=rkTexto();try{await navigator.clipboard.writeText(t);toast('Texto copiado! Cola no grupo do WhatsApp.')}catch(e){openSheet('txt',{t})}},
 plLado(d){U.pl=d.v;render()},
 plJ(d){const g=jogoAtual(aberta());if(!g)return;const v=+d.v,id=d.j,l=d.l;
  if(d.k==='g'){if(v>0){g.ev.push({id:uid(),lado:l,autor:id,assist:null});l==='a'?g.ga++:g.gb++;save();render();toast('GOOOL do '+nomeJ(id)+'! Quem deu o passe? Toque + em Assist.')}
   else{let i=-1;for(let k=g.ev.length-1;k>=0;k--)if(g.ev[k].autor===id){i=k;break}if(i<0)return;g.ev.splice(i,1);l==='a'?g.ga--:g.gb--;save();render()}}
  else{if(v>0){let e=null;for(let k=g.ev.length-1;k>=0;k--){const x=g.ev[k];if(x.lado===l&&!x.assist&&x.autor!==id){e=x;break}}
    if(!e)return toast('Marque o gol primeiro, depois a assistência.');e.assist=id;save();render();toast('Assistência de '+nomeJ(id)+' pro gol do '+(e.autor?nomeJ(e.autor):'time')+'.')}
   else{let e=null;for(let k=g.ev.length-1;k>=0;k--)if(g.ev[k].assist===id){e=g.ev[k];break}if(!e)return;e.assist=null;save();render()}}},
 dur(d){const ab=aberta();const g=ab&&jogoAtual(ab);const cl=x=>Math.max(1,Math.min(90,x));if(g){g.dur=cl((g.dur||pel().duracao)+Number(d.v))}else{if(!isAdm())return;const p=pel();p.duracao=cl(p.duracao+Number(d.v))}save();render()},
 durSet(d){if(!isAdm())return;pel().duracao=Number(d.v);save();render()},
 frasesPadrao(){pel().frases=JSON.parse(JSON.stringify(FRASES_PADRAO));save();render();toast('Frases originais de volta.')},
 confOk(){const c=U.sheet;closeSheet();const r=aberta();
  if(c.acao==='montar'){montarTimes();return}
  if(c.acao==='fecharDia'){const cp=campeaoCalc(r);r.campeaoId=cp?cp.id:null;r.fechada=true;r.coment=gerarComentarios(r);U.per=null;U.tab='rodadas';U.rodada=r.id;save();SCRL.scrollTo(0,0);render();toast('Dia fechado! Ranking atualizado.')}
  else if(c.acao==='cancelJogo'){r.jogos=r.jogos.filter(g=>g.fim);save();render()}
  else if(c.acao==='apagarRodada'){S.rodadas=S.rodadas.filter(x=>x.id!==c.id);save();render()}
  else if(c.acao==='delJog'){S.jogadores=S.jogadores.filter(j=>j.id!==c.id);save();render()}
  else if(c.acao==='removeMembro'){sb.from('membros').delete().eq('pelada_id',S.atual).eq('user_id',c.id).then(({error})=>{if(error)toast('Não deu: '+error.message);else{toast('Removido.');carregarMembros()}})}},
 login(d){openSheet('auth',{modo:d.m||'entrar'})},
 authModo(d){U.sheet.modo=d.v;renderSheet()},
 conta(){openSheet('conta')},
 async sair(){closeSheet();await sb.auth.signOut();toast('Você saiu da conta.')},
 vit(d){G.vit=d.v;render()},
 verPel(d){openSheet('verPel',{id:d.id})},
 temConvite(){openSheet('convite')},
 irVitrine(){G.view='vitrine';closeSheet();SCRL.scrollTo(0,0);render()},
 async usarConvite(){let c=$('#cvCod').value.trim();const m=c.match(/convite=([a-z0-9]+)/i);if(m)c=m[1];if(!c)return toast('Cole o link ou o código.');
  const {data,error}=await sb.rpc('entrar_convite',{c});if(error)return toast('Convite inválido.');closeSheet();await carregarMinhas();await carregarVitrine();toast('Você entrou na pelada!');abrirPelada(data)},
 trocarPel(d){closeSheet();if(G.minhas[d.id])abrirPelada(d.id)},
 novaPel(){if(!G.user)return openSheet('auth',{modo:'criar'});U.tmp={};openSheet('pel')},
 async salvaPel(d,e,btn){const nome=$('#npNome').value.trim();if(nome.length<2)return toast('Coloca o nome da pelada.');
  const p=novaPelada({nome,cidade:$('#npCid').value.trim(),uf:$('#npUf').value,dia:+$('#npDia').value,porTime:+$('#npPT').value||5,duracao:+$('#npDur').value||8,logo:U.tmp.logo||null});
  const row=pelToRow(p);delete row.id;row.criado_por=G.user.id;if(btn)btn.disabled=true;
  const {data,error}=await sb.from('peladas').insert(row).select().single();if(btn)btn.disabled=false;
  if(error)return toast('Não consegui cadastrar: '+error.message);
  closeSheet();S.peladas.push(pelFromRow(data));await carregarMinhas();await abrirPelada(data.id);U.tab='mais';U.mais='jogadores';render();toast('Pelada cadastrada! Agora cadastre os jogadores.')},
 copiaLink(){const l=linkConvite();if(!l)return;navigator.clipboard.writeText(l).then(()=>toast('Link copiado! Manda no grupo.'),()=>openSheet('txt',{t:l}))},
 async novoLink(){const {data,error}=await sb.rpc('novo_convite',{p:S.atual});if(error)return toast('Não deu pra gerar.');G.codigo=data;render();toast('Link novo gerado. O antigo não funciona mais.')},
 async papel(d){const {error}=await sb.from('membros').update({papel:d.v}).eq('pelada_id',S.atual).eq('user_id',d.u);if(error)return toast('Não deu: '+error.message);toast(d.v==='admin'?'Agora é admin.':'Agora é jogador.');carregarMembros()},
 removeMembro(d){openSheet('conf',{titulo:'Remover da pelada?',texto:'A pessoa perde o acesso. Pode voltar com um link de convite.',ok:'Remover',perigo:1,acao:'removeMembro',id:d.u})},
 novoDesafio(d){if(!minhasAdmin().length)return toast('Só admin de pelada pode desafiar.');openSheet('desafio',{alvo:d.alvo||null})},
 novaVaga(){openSheet('desafio',{vaga:true})},
 salvaDesafio(d){const de=($('#dDe')&&$('#dDe').value)||(isAdm()?S.atual:minhasAdmin()[0]);const alvo=d.vaga?null:($('#dAlvo')&&$('#dAlvo').value);
  if(!d.vaga&&(!alvo||alvo===de))return toast('Escolha o adversário.');
  S.batalhas.push({id:uid(),a:de,b:alvo,status:d.vaga?'vaga':'desafio',data:$('#dData').value||'',hora:$('#dHora').value||'',local:$('#dLocal').value.trim(),ga:0,gb:0,st:{},okA:false,okB:false});
  save();closeSheet();render();toast(d.vaga?'Vaga aberta! Aparece pra todas as peladas.':'Desafio enviado! Agora é esperar o admin de lá aceitar.')},
 async candidatar(d){const adm=minhasAdmin();const me=adm.includes(S.atual)?S.atual:adm[0];if(!me)return toast('Só admin de pelada pode se candidatar.');
  const {error}=await sb.rpc('candidatar',{bid:d.id,p:me});if(error)return toast(error.message||'Não deu.');
  const b=S.batalhas.find(x=>x.id===d.id);if(b){b.b=me;b.status='candidatura';LAST['batalhas|'+b.id]=JSON.stringify(batToRow(b))}render();toast('Pronto! Agora o admin da vaga aceita ou recusa.')},
 batAceitar(d){const b=S.batalhas.find(x=>x.id===d.id);b.status='marcada';save();render();toast('Batalha marcada!')},
 batRecusar(d){const b=S.batalhas.find(x=>x.id===d.id);if(b.status==='candidatura'){b.b=null;b.status='vaga'}else b.status='recusada';save();render()},
 async batCancelar(d){const b=S.batalhas.find(x=>x.id===d.id);
  if(b.status==='candidatura'&&b.b===S.atual){const {error}=await sb.rpc('desistir',{bid:b.id});if(error)return toast('Não deu.');b.b=null;b.status='vaga';delete LAST['batalhas|'+b.id];if(G.minhas[b.a]==='admin')LAST['batalhas|'+b.id]=JSON.stringify(batToRow(b));render();return}
  b.status='cancelada';save();render()},
 batGol(d){const b=S.batalhas.find(x=>x.id===d.id);const k=d.l==='a'?'ga':'gb';const st=batSt(b);const meu=(d.l==='a'?b.a:b.b)===S.atual;
  if(+d.v<0&&meu){const atr=elenco(S.atual).reduce((s,j)=>s+((st[j.id]||{}).g||0),0);if(b[k]-atr<=0)return toast(b[k]?'Esse gol tá num jogador: tire no − da lista.':'Placar já tá zerado.')}
  b[k]=Math.max(0,b[k]+Number(d.v));b.okA=b.okB=false;save();render()},
 batJ(d){const b=S.batalhas.find(x=>x.id===d.id);const st=batSt(b);const x=st[d.j]||(st[d.j]={g:0,a:0});const v=Number(d.v);
  if(v<0&&!x[d.k])return;x[d.k]+=v;if(d.k==='g'){const k=b.a===S.atual?'ga':'gb';b[k]=Math.max(0,b[k]+v)}
  b.okA=b.okB=false;save();render();if(v>0&&d.k==='g')toast('GOOOL do '+nomeJ(d.j)+'!')},
 batConf(d){const b=S.batalhas.find(x=>x.id===d.id);const k=b.a===S.atual?'okA':'okB';b[k]=!b[k];save();render();if(b.okA&&b.okB)toast('Batalha confirmada! Entrou no ranking.')},
 async pedirEntrada(d){if(!G.user)return openSheet('auth',{modo:'criar'});const papel=d.p==='admin'?'admin':'jogador';const {error}=await sb.from('solicitacoes').insert({pelada_id:d.id,user_id:G.user.id,nome:nomeUser(),papel});
  if(error&&!/duplicate/i.test(error.message))return toast('Não deu: '+error.message);G.pedidos[d.id]=papel;renderSheet();render();toast(papel==='admin'?'Pedido de admin enviado! Um admin da pelada precisa aprovar.':'Pedido enviado! O admin vai aprovar.')},
 async cancelaPedido(d){await sb.from('solicitacoes').delete().eq('pelada_id',d.id).eq('user_id',G.user.id);delete G.pedidos[d.id];renderSheet();render()},
 async aceitaPedido(d){const {error}=await sb.rpc('aceitar_pedido',{p:S.atual,u:d.u});if(error)return toast('Não deu: '+error.message);toast('Aceito!');carregarMembros()},
 async recusaPedido(d){const {error}=await sb.from('solicitacoes').delete().eq('pelada_id',S.atual).eq('user_id',d.u);if(error)return toast('Não deu.');toast('Pedido recusado.');carregarMembros()},
 scrim(d,e){if(e.target.classList.contains('scrim'))closeSheet()},
 fechaSheet(){closeSheet()}
};
document.addEventListener('click',e=>{if(Date.now()-noClick<400)return;const el=e.target.closest('[data-a]');if(!el)return;const f=A[el.dataset.a];if(f)f(el.dataset,e,el)});
document.addEventListener('change',e=>{const el=e.target;const f=el.dataset.f;
 if(el.dataset.up){const file=el.files&&el.files[0];if(!file)return;const k=el.dataset.up;
  lerImagem(file,k==='fotoRodada'?1100:400,url=>{if(k==='logo'){pel().logo=url;save();render()}else if(k==='fotoRodada'){R(el.dataset.id).foto=url;save();render();toast('Foto do campeão salva na rodada.')}else if(k==='fotoJog'){U.tmp.foto=url;renderSheet()}else if(k==='logoNova'){U.tmp.logo=url;renderSheet()}});return}
 if(!f)return;const p=pel()||{};
 if(f==='perMes'){U.per.mes=+el.value;render()}
 else if(f==='perAno'){U.per.ano=+el.value;render()}
 else if(f==='tnome'){const t=aberta().times.find(t=>t.id===el.dataset.id);t.nome=el.value.trim()||t.nome;save()}
 else if(f==='novo'){U.novo[+el.dataset.i]=el.value}
 else if(f==='cfg'){const k=el.dataset.k;let v=el.value;if(k==='golsFim')v=Math.max(0,+v||0);else if(k==='dia'||k==='porTime'||k==='duracao')v=Math.max(k==='dia'?0:1,+v||0);if(k==='nome'&&!v.trim())return;p[k]=v;save();render()}
 else if(f==='peso'){const v=parseFloat(String(el.value).replace(',','.'));p.pesos[el.dataset.k]=isNaN(v)?0:v;save();render()}
 else if(f==='frase'){p.frases[el.dataset.k]=el.value.split('\n').map(s=>s.trim()).filter(Boolean);save();toast('Frases salvas.')}
 else if(f==='fUf'){G.uf=el.value;G.cidade='';render()}
 else if(f==='fCid'){G.cidade=el.value;render()}
 else if(f==='rodData'){const r=S.rodadas.find(x=>x.id===el.dataset.id);if(r&&el.value&&el.value!==r.data){r.data=el.value;save();render();toast('Data trocada pra '+diaSem(r.data)+', '+dm(r.data)+'.')}}
 else if(f==='pelFiltro'){U.pelFiltro=el.value;render()}
 else if(f==='h2h'){U.h2h[+el.dataset.i]=el.value||null;render()}});


const salvaCred=(id,password)=>{try{if(window.PasswordCredential&&navigator.credentials)navigator.credentials.store(new PasswordCredential({id,password,name:id})).catch(()=>{})}catch(e){}};
const msgErro=e=>{const m=(e&&e.message)||'';if(/already registered|already exists/i.test(m))return 'Esse e-mail já tem conta. Toque em Entrar.';if(/password/i.test(m))return 'A senha precisa ter pelo menos 6 caracteres.';if(/email/i.test(m))return 'Confira o e-mail.';return m||'Não deu certo. Tente de novo.'};
document.addEventListener('submit',async e=>{const f=e.target;if(!f.dataset||!f.dataset.f2)return;e.preventDefault();const bt=f.querySelector('button[type=submit]');if(bt)bt.disabled=true;
 try{if(f.dataset.f2==='auth'){const m=U.sheet.modo||'entrar';const email=$('#aEmail').value.trim();
  if(m==='esqueci'){const {error}=await sb.auth.resetPasswordForEmail(email,{redirectTo:location.origin+location.pathname});if(error)return toast(msgErro(error));closeSheet();return toast('Mandei um link pro seu e-mail.')}
  const senha=$('#aSenha').value;
  if(m==='criar'){const nome=$('#aNome').value.trim();if(!nome)return toast('Coloca seu nome.');const {error}=await sb.auth.signUp({email,password:senha,options:{data:{nome}}});if(error)return toast(msgErro(error));salvaCred(email,senha);closeSheet();toast('Conta criada! Bem-vindo.')}
  else{const {error}=await sb.auth.signInWithPassword({email,password:senha});if(error)return toast('E-mail ou senha errados.');salvaCred(email,senha);closeSheet()}}
 else if(f.dataset.f2==='novaSenha'){const {error}=await sb.auth.updateUser({password:$('#nSenha').value});if(error)return toast(msgErro(error));closeSheet();toast('Senha nova salva.')}}
 finally{if(bt)bt.disabled=false}});
/* ---- trava a tela no lugar (sem deslizar pro lado) ---- */
const travaX=()=>{if(SCRL.scrollLeft)SCRL.scrollLeft=0;if(scrollX||scrollY)window.scrollTo(0,0);document.body.scrollLeft=0;document.documentElement.scrollLeft=0};
SCRL.addEventListener('scroll',()=>{if(SCRL.scrollLeft)SCRL.scrollLeft=0},{passive:true});
addEventListener('resize',travaX);addEventListener('orientationchange',()=>setTimeout(travaX,300));document.addEventListener('focusout',()=>setTimeout(travaX,50));
if(window.visualViewport)visualViewport.addEventListener('resize',()=>setTimeout(travaX,50));
/* ============ START ============ */
boot();
